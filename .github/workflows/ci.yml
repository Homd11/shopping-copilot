name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: make ci
      - name: HTTP health checks
        shell: bash
        env:
          LLM_PROVIDER: scripted
          LLM_MODEL: scripted-v1
        run: |
          pnpm --filter @shopping-copilot/store start &
          python -m uvicorn agent.app:app --host 127.0.0.1 --port 8000 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4000/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && exit 0
            sleep 1
          done
          exit 1
