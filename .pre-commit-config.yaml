repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.12.8]
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check
        language: python
        additional_dependencies: [ruff==0.12.8]
        types: [python]
      - id: eslint
        name: eslint
        entry: pnpm lint:ts
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx]
