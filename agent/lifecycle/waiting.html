<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Start Shopping Copilot</title>
    <style nonce="NONCE">
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef2fa;
        color: #182d52;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: min(31rem, 85vw);
        padding: 2rem;
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 70px #182d5212;
      }
      h1 {
        line-height: 1.15;
      }
      label,
      input,
      button {
        display: block;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        border: 1px solid #8c9bb5;
        border-radius: 8px;
        padding: 0.7rem;
        margin: 0.5rem 0 1rem;
      }
      button,
      a {
        font: inherit;
        background: #2755dd;
        color: white;
        border: 0;
        padding: 0.7rem 1rem;
        border-radius: 8px;
      }
      button:disabled {
        opacity: 0.5;
      }
      a {
        display: inline-block;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>SHOPPING COPILOT</p>
      <h1>Your shopping space, ready when you are.</h1>
      <p>The demo sleeps when idle. Enter your invitation to start it.</p>
      <form>
        <label for="code">Invitation code / رمز الدعوة</label>
        <input
          id="code"
          type="password"
          autocomplete="off"
          required
          maxlength="128"
        />
        <button type="submit">Start demo / ابدأ التجربة</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="enter" hidden href="http://localhost:4100/" rel="noreferrer"
        >Enter shopping / ابدأ التسوق</a
      >
      <p>
        Re-enter your invitation inside the demo. A server restart starts a
        fresh cart and fictional orders; an ordinary page refresh does not clear
        them.
      </p>
    </main>
    <script nonce="NONCE">
      const form = document.querySelector("form");
      const input = document.querySelector("input");
      const button = document.querySelector("button");
      const status = document.querySelector("#status");
      const enter = document.querySelector("#enter");
      let timer;
      let polls = 0;
      function finish(message) {
        status.textContent = message;
        button.disabled = false;
        clearTimeout(timer);
      }
      async function poll() {
        if (++polls > 60)
          return finish(
            "Startup timed out. Retry later or ask the owner to start the demo.",
          );
        try {
          const response = await fetch("/status", {
            cache: "no-store",
            signal: AbortSignal.timeout(5000),
          });
          if (!response.ok)
            return finish("Status unavailable. Please retry later.");
          const state = (await response.json()).state;
          if (state === "ready") {
            enter.hidden = false;
            return finish(
              "Ready. Your invitation will be checked again inside.",
            );
          }
          if (state === "failed" || state === "stopped")
            return finish(
              "The demo did not start. Wait one minute and try again, or contact the owner.",
            );
          if (state === "unhealthy")
            return finish(
              "The shopping service is unavailable. Retry later or contact the owner.",
            );
          status.textContent =
            state === "stopping" || state === "draining"
              ? "Finishing a shutdown. Retry startup when it completes."
              : "Starting your shopping space… this may take a few minutes.";
          timer = setTimeout(poll, 5000);
        } catch {
          finish(
            "Connection unavailable. Retry later; no shopping action was sent.",
          );
        }
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearTimeout(timer);
        polls = 0;
        enter.hidden = true;
        button.disabled = true;
        const code = input.value;
        input.value = "";
        try {
          const body = JSON.stringify({ code });
          const digest = await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(body),
          );
          const hash = Array.from(new Uint8Array(digest), (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");
          const response = await fetch("/wake", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-amz-content-sha256": hash,
            },
            body,
            signal: AbortSignal.timeout(5000),
          });
          if (!response.ok)
            return finish(
              response.status === 403
                ? "Invitation unavailable or expired. Check with the owner."
                : "Service busy or unavailable. Retry later.",
            );
          await poll();
        } catch {
          finish("Could not request startup. Retry later.");
        }
      });
    </script>
  </body>
</html>
